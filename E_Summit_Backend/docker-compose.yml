services:
  postgres:
    # pgvector-enabled image — required by the §4.6 RAG concierge index
    image: pgvector/pgvector:pg16
    container_name: esummit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esummit
      POSTGRES_PASSWORD: esummit_dev_password
      POSTGRES_DB: esummit
    ports:
      - '5433:5432'
    volumes:
      - esummit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esummit -d esummit']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: esummit_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - esummit_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  esummit_pgdata:
  esummit_redisdata:
