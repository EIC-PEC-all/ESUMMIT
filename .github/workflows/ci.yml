name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-checks:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mongodb://localhost:27017/esummit?replicaSet=rs0"
      JWT_SECRET: "dummy_jwt_secret_for_ci_build_test_1234567890"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install & Generate Prisma Client
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  frontend-checks:
    name: Frontend (Next.js 14)
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: "dummy_secret_for_ci_build_test_1234567890"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  admin-checks:
    name: Admin CMS (Next.js 16)
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: "dummy_secret_for_ci_build_test_1234567890"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/api/v1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install & Build Admin
        working-directory: ./admin
        run: |
          npm ci
          npm run build
