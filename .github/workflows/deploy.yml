name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Backend Build
        working-directory: ./backend
        env:
          DATABASE_URL: "mongodb://localhost:27017/esummit?replicaSet=rs0"
          JWT_SECRET: "dummy_jwt_secret_for_ci_build_test_1234567890"
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Verify Frontend Build
        working-directory: ./frontend
        env:
          NEXTAUTH_SECRET: "dummy_secret_for_ci_build_test_1234567890"
        run: |
          npm ci
          npm run build

      - name: Verify Admin Build
        working-directory: ./admin
        env:
          AUTH_SECRET: "dummy_secret_for_ci_build_test_1234567890"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/api/v1"
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting E-Summit Deployment..."
            
            cd ~/E-SUMMIT || cd /var/www/esummit || cd /app/esummit
            
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            
            docker compose up --build -d --remove-orphans
            
            docker image prune -f
            
            echo "Verifying service health..."
            sleep 5
            curl -f http://localhost:4000/api/v1/health || (echo "Backend Health Check Failed!" && exit 1)
            
            echo "E-Summit Successfully Deployed to Production."
