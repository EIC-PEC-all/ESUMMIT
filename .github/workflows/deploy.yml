name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Backend Build
        working-directory: ./backend
        env:
          DATABASE_URL: "mongodb://localhost:27017/esummit?replicaSet=rs0"
          JWT_SECRET: "dummy_jwt_secret_for_ci_build_test_1234567890"
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Verify Frontend Build
        working-directory: ./frontend
        env:
          NEXTAUTH_SECRET: "dummy_secret_for_ci_build_test_1234567890"
        run: |
          npm ci
          npm run build

      - name: Verify Admin Build
        working-directory: ./admin
        env:
          AUTH_SECRET: "dummy_secret_for_ci_build_test_1234567890"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/api/v1"
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check VPS Configuration
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST secret is not configured in GitHub Secrets. Skipping VPS deployment."
          else
            echo "VPS_HOST is configured. Proceeding with deployment."
          fi

      - name: Deploy to VPS via SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting E-Summit Deployment..."
            
            cd ~/E-SUMMIT || cd /var/www/esummit || cd /app/esummit
            
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Current deployment commit: $PREV_COMMIT"
            
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            
            echo "Building and restarting production containers..."
            docker compose up --build -d --remove-orphans
            
            echo "Verifying backend health..."
            HEALTHY=0
            for i in {1..5}; do
              sleep 4
              if curl -sf http://localhost:4000/api/v1/health; then
                HEALTHY=1
                echo "Health check passed on attempt $i."
                break
              fi
              echo "Waiting for health check attempt $i/5..."
            done
            
            if [ $HEALTHY -eq 0 ]; then
              echo "Health check failed! Triggering automated rollback to $PREV_COMMIT..."
              git reset --hard $PREV_COMMIT
              git submodule update --init --recursive
              docker compose up --build -d --remove-orphans
              echo "Successfully rolled back to $PREV_COMMIT."
              exit 1
            fi
            
            docker image prune -f
            echo "E-Summit Successfully Deployed to Production."
